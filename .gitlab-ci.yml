
#### constants ####

variables:
  # dependency versions
  BOOST_VERSION: 1.80.0
  SOPLEX_REVISION: v8.1.0
  SCIP_REVISION: v10.1.0
  HIGHS_REVISION: v1.15.1
  ORTOOLS_VERSION: 9.15
  ORTOOLS_BUILD: 6755
  # Commit 3.3.26 https://gitlab.com/MIAOresearch/software/roundingsat/-/commit/d4edbf7908a9bb951fd181940919e0f3ac7ab1ee
  ROUNDINGSAT_REVISION: d4edbf7908a9bb951fd181940919e0f3ac7ab1ee

  # project directories
  SETUP_DIR: ${CI_PROJECT_DIR}/setups
  BUILD_DIR: ${CI_PROJECT_DIR}/builds
  INSTALL_DIR: ${CI_PROJECT_DIR}/../installs

  # source directories
  BOOST_DIR: ${SETUP_DIR}/boost
  SOPLEX_DIR: ${SETUP_DIR}/soplex
  SCIP_DIR: ${SETUP_DIR}/scip
  HIGHS_DIR: ${SETUP_DIR}/highs
  ROUNDINGSAT_DIR: ${SETUP_DIR}/roundingsat
  ORTOOLS_DIR: ${SETUP_DIR}/ortools

#### stages ####

stages:
  - setup
  - test
  - integrate

#### setups ####

.common:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
      when: manual
    - if: $CI_MERGE_REQUEST_ID
  image:
    name: gcc:12
  # required to pick a reasonable runner
  tags:
    - compile
  before_script:
    - apt-get update
    - apt-get install -y cmake libtbb-dev libmpfr-dev libcriterion-dev
    - export CFLAGS="-Werror"
    - export CXXFLAGS="-Werror"
    - export LD_LIBRARY_PATH=${INSTALL_DIR}/lib:${LD_LIBRARY_PATH}
    - export CMAKE_PREFIX_PATH=${INSTALL_DIR}
    - mkdir -p ${CI_PROJECT_DIR}/installs
    - mv ${CI_PROJECT_DIR}/installs ${INSTALL_DIR}
  after_script:
    - mv ${INSTALL_DIR} ${CI_PROJECT_DIR}/installs

boost-setup:
  extends: .common
  stage: setup
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/installs
    expire_in: 1 minute
  script:
    - mkdir -p ${BOOST_DIR}
    - export CFLAGS=""
    - export CXXFLAGS=""
    - wget https://archives.boost.io/release/${BOOST_VERSION}/source/boost_$(echo ${BOOST_VERSION} | tr . _).tar.gz -O ${BOOST_DIR}.tar.gz
    - tar -xzf ${BOOST_DIR}.tar.gz -C ${BOOST_DIR} --strip-components=1
    - cd ${BOOST_DIR}
    - ./bootstrap.sh --prefix=${INSTALL_DIR} --with-libraries=program_options,serialization,iostreams,regex
    - ./b2 --prefix=${INSTALL_DIR} -j8 install

"ortools-setup":
  extends: .common
  stage: setup
  artifacts:
    paths:
      - ${ORTOOLS_DIR}
    expire_in: 1 hour
  when: manual
  allow_failure: true
  # use the prebuilt C++ archive for Debian 12 (base of the gcc:12 image), building from source takes hours
  # it bundles its own Boost, SCIP, SoPlex and HiGHS, hence it is kept out of INSTALL_DIR
  script:
    - mkdir -p ${ORTOOLS_DIR}
    - wget https://github.com/google/or-tools/releases/download/v${ORTOOLS_VERSION}/or-tools_amd64_debian-12_cpp_v${ORTOOLS_VERSION}.${ORTOOLS_BUILD}.tar.gz -O ${ORTOOLS_DIR}.tar.gz
    - tar -xzf ${ORTOOLS_DIR}.tar.gz -C ${ORTOOLS_DIR} --strip-components=1


papilo-setup:
  extends: .common
  stage: setup
  needs: [ boost-setup ]
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/installs
    expire_in: 1 minute
  script:
    - cmake ${CI_PROJECT_DIR} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR}
    - make -j8 install
    - ctest --output-on-failure -j8

"roundingsat-setup":
  extends: .common
  stage: setup
  artifacts:
    paths:
      - ${ROUNDINGSAT_DIR}
    expire_in: 1 hour
  when: manual
  allow_failure: true
  # PaPILO compiles the RoundingSat sources itself, so only the sources are provided
  script:
    - mkdir -p ${ROUNDINGSAT_DIR}
    - wget https://gitlab.com/MIAOresearch/software/roundingsat/-/archive/${ROUNDINGSAT_REVISION}/roundingsat-${ROUNDINGSAT_REVISION}.tar.gz -O ${ROUNDINGSAT_DIR}.tar.gz
    - tar -xzf ${ROUNDINGSAT_DIR}.tar.gz -C ${ROUNDINGSAT_DIR} --strip-components=1

soplex-setup:
  extends: .common
  stage: setup
  needs: [ boost-setup ]
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/installs
    expire_in: 1 minute
  script:
    - mkdir -p ${SETUP_DIR}
    - export CFLAGS=""
    - export CXXFLAGS=""
    - git clone https://github.com/scipopt/soplex.git ${SOPLEX_DIR}
    - cd ${SOPLEX_DIR}
    - git checkout ${SOPLEX_REVISION}
    - cmake . -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} -DPAPILO=off
    - make -j8 install

check-cmakeconfig-includes:
  extends: .common
  stage: setup
  script:
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_QUADMATH
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_GMP
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BOOST
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BOOST_IOSTREAMS_ZLIB
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BOOST_IOSTREAMS_BZIP2
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BOOST_PROGRAM_OPTIONS
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BOOST_SERIALIZATION
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_LUSOL
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_BYTELL_HASHMAP
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_GITHASH
    - /bin/bash test/check_CmakeConfig_includes.sh ${CI_PROJECT_DIR} PAPILO_HAS_TBB

scip-setup:
  extends: .common
  stage: setup
  needs: [ soplex-setup ]
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/installs
    expire_in: 1 minute
  script:
    - mkdir -p ${SETUP_DIR}
    - export CFLAGS=""
    - export CXXFLAGS=""
    - git clone https://github.com/scipopt/scip.git ${SCIP_DIR}
    - mkdir ${SCIP_DIR}/build
    - cd ${SCIP_DIR}/build
    - git checkout ${SCIP_REVISION}
    - cmake .. -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} -DLPS=spx -DREADLINE=off -DZIMPL=off -DIPOPT=off -DPAPILO=off
    - make -j8 install

highs-setup:
  extends: .common
  stage: setup
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/installs
    expire_in: 1 minute
  when: manual
  allow_failure: true
  script:
    - mkdir -p ${SETUP_DIR}
    - export CFLAGS=""
    - export CXXFLAGS=""
    - git clone https://github.com/ERGO-Code/HiGHS ${HIGHS_DIR}
    - mkdir ${HIGHS_DIR}/build
    - cd ${HIGHS_DIR}/build
    - git checkout ${HIGHS_REVISION}
    - cmake .. -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR}
    - make -j8 install

#### defining tests ####

".scan-build":
  extends: .common
  stage: test
  script:
    - apt-get install -y clang clang-tools
    - mkdir -p ${BUILD_DIR}/${CI_JOB_NAME}
    - mkdir -p ${BUILD_DIR}/${CI_JOB_NAME}/build
    - cd ${BUILD_DIR}/${CI_JOB_NAME}/build
    - scan-build -o $CI_PROJECT/clangScanBuildReports cmake $CI_PROJECT_DIR -DCMAKE_BUILD_TYPE=Debug ${CMAKE_FLAGS}
    - scan-build -o $CI_PROJECT/clangScanBuildReports make -j6

".ctest":
  extends: .common
  stage: test
  script:
    - mkdir -p ${BUILD_DIR}/${CI_JOB_NAME}
    - cd ${BUILD_DIR}/${CI_JOB_NAME}
    - cmake ${CI_PROJECT_DIR} -DCMAKE_BUILD_TYPE=Debug ${CMAKE_FLAGS}
    - make -j8
    - ctest --output-on-failure -j8

".integration":
  extends: .common
  stage: integrate
  when: manual
  allow_failure: false
  script:
    - mkdir -p ${BUILD_DIR}/${CI_JOB_NAME}
    - git clone ${SOLVER_REPOSITORY} ${BUILD_DIR}/${CI_JOB_NAME}
    - mkdir ${BUILD_DIR}/${CI_JOB_NAME}/build
    - cd ${BUILD_DIR}/${CI_JOB_NAME}/build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug ${CMAKE_FLAGS}
    - make -j8
    - ctest --output-on-failure -j8

#### applying tests ####

"scan-build":
  extends: .scan-build
  needs: [ boost-setup ]
  variables:
    CMAKE_FLAGS: ""

"ctest_release":
  extends: .ctest
  needs: [ boost-setup ]
  variables:
    CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=Release"

"ctest_no_tbb":
  extends: .ctest
  needs: [ boost-setup ]
  variables:
    CMAKE_FLAGS: "-DTBB=off"

"ctest_soplex":
  extends: .ctest
  needs: [ boost-setup, soplex-setup ]
  variables:
    CMAKE_FLAGS: "-DSOPLEX=on"

"ctest_scip":
  extends: .ctest
  needs: [ boost-setup, scip-setup ]
  variables:
    CMAKE_FLAGS: "-DSCIP=on -DSOPLEX=off"

"ctest_highs":
  extends: .ctest
  needs: [ boost-setup, highs-setup ]
  allow_failure: true
  variables:
    CMAKE_FLAGS: "-DHIGHS=on"

"ctest_ortools":
  extends: .ctest
  needs: [ boost-setup, ortools-setup ]
  allow_failure: true
  variables:
    # INSTALL_DIR first so that Boost from boost-setup is preferred over the bundled one
    CMAKE_FLAGS: "-DGLOP=on -DSCIP=off -DSOPLEX=off -DHIGHS=off -DCMAKE_PREFIX_PATH=${INSTALL_DIR};${ORTOOLS_DIR}"


"ctest_roundingsat":
  extends: .ctest
  needs: [ boost-setup, roundingsat-setup ]
  allow_failure: true
  variables:
    CMAKE_FLAGS: "-DROUNDINGSAT_DIR=${ROUNDINGSAT_DIR}"


"soplex_integration":
  extends: .integration
  needs: [ papilo-setup ]
  variables:
    SOLVER_REPOSITORY: "https://github.com/scipopt/soplex.git"
    CMAKE_FLAGS: "-DPAPILO=on"

"scip_integration":
  extends: .integration
  needs: [ papilo-setup, soplex-setup ]
  variables:
    SOLVER_REPOSITORY: "https://github.com/scipopt/scip.git"
    CMAKE_FLAGS: "-DLPS=spx -DREADLINE=off -DZIMPL=off -DIPOPT=off -DPAPILO=on"
